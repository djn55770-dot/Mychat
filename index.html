<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>My Chat</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #d9dbd5;
}

body {
    overflow: hidden;
}

.chat {
    width: 100%;
    max-width: 600px;
    height: 100dvh;
    margin: auto;
    background: #efe7dd;
    display: flex;
    flex-direction: column;
}


/* =========================
   HEADER
========================= */

.header {
    flex-shrink: 0;
    background: #075e54;
    color: white;
    padding: 16px;
    font-size: 23px;
    font-weight: bold;
}


/* =========================
   JOIN
========================= */

.join {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding: 9px;
    background: #075e54;
}

#chatId {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: none;
    border-radius: 9px;
    outline: none;
    font-size: 16px;
}

#joinBtn {
    padding: 0 18px;
    border: none;
    border-radius: 9px;
    background: white;
    color: #075e54;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}


/* =========================
   ROOM
========================= */

#roomName {
    display: none;
    flex-shrink: 0;
    background: #128c7e;
    color: white;
    padding: 9px 13px;
}


/* =========================
   TYPING
========================= */

#typingStatus {
    height: 24px;
    flex-shrink: 0;
    padding: 4px 14px 0;
    background: #efe7dd;
    color: #128c7e;
    font-size: 13px;
    font-style: italic;
}


/* =========================
   SELECT BAR
========================= */

#selectBar {
    display: none;
    flex-shrink: 0;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: #075e54;
    color: white;
}

#selectedCount {
    flex: 1;
    font-weight: bold;
}

#deleteSelectedBtn {
    border: none;
    border-radius: 7px;
    padding: 9px 12px;
    background: #d32f2f;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#cancelSelectBtn {
    border: none;
    border-radius: 7px;
    padding: 9px 12px;
    background: white;
    color: #075e54;
    font-weight: bold;
    cursor: pointer;
}


/* =========================
   MESSAGES
========================= */

#messages {
    flex: 1;
    min-height: 0;
    padding: 10px;
    overflow-y: auto;

    display: flex;
    flex-direction: column;
    justify-content: flex-end;
}

.messageRow {
    display: flex;
    width: 100%;
    margin: 3px 0;
    align-items: center;
    gap: 7px;
}

.myRow {
    justify-content: flex-end;
}

.otherRow {
    justify-content: flex-start;
}

.selectBox {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    cursor: pointer;
}

.message {
    position: relative;
    max-width: 82%;
    width: fit-content;

    padding: 9px 13px;
    border-radius: 11px;

    word-break: break-word;
    overflow-wrap: anywhere;

    font-size: 16px;
    line-height: 1.35;

    user-select: none;
    -webkit-user-select: none;

    cursor: default;
}

.my-message {
    background: #dcf8c6;
    border-bottom-right-radius: 3px;
}

.other-message {
    background: white;
    border-bottom-left-radius: 3px;
}

.selectedMessage {
    outline: 3px solid #128c7e;
}

.edited {
    margin-left: 6px;
    color: #777;
    font-size: 11px;
}


/* =========================
   EDIT BAR
========================= */

#editBar {
    display: none;
    flex-shrink: 0;
    background: #e8e8e8;
    padding: 8px 12px;
    border-left: 4px solid #128c7e;
}

#editBar span {
    color: #075e54;
    font-size: 14px;
}

#cancelEdit {
    float: right;
    border: none;
    background: transparent;
    color: #777;
    font-size: 18px;
    cursor: pointer;
}


/* =========================
   SEND
========================= */

.send {
    flex-shrink: 0;

    display: flex;
    gap: 8px;

    padding: 9px;

    padding-bottom:
        calc(9px + env(safe-area-inset-bottom));

    background: #ddd;
}

#message {
    flex: 1;
    min-width: 0;

    height: 48px;

    padding: 0 16px;

    border: none;
    border-radius: 25px;

    outline: none;

    background: white;
    color: #111;

    font-size: 16px;
}

#sendBtn {
    flex-shrink: 0;

    height: 48px;

    padding: 0 18px;

    border: none;
    border-radius: 25px;

    background: #128c7e;
    color: white;

    font-weight: bold;

    cursor: pointer;
}

#sendBtn:disabled {
    background: #999;
}


/* =========================
   MESSAGE MENU
========================= */

#messageMenu {
    display: none;

    position: fixed;

    z-index: 99999;

    width: 165px;

    background: white;

    border-radius: 10px;

    overflow: hidden;

    box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.25);
}

#messageMenu button {
    display: block;

    width: 100%;

    padding: 14px;

    border: none;

    background: white;

    text-align: left;

    font-size: 16px;

    cursor: pointer;
}

#messageMenu button:hover {
    background: #eeeeee;
}

#messageMenu button:active {
    background: #dddddd;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .message {
        max-width: 85%;
    }

}

</style>

</head>


<body>


<div class="chat">


<!-- HEADER -->

<div class="header">
    💬 My Chat
</div>


<!-- JOIN -->

<div class="join">

    <input
        id="chatId"
        type="text"
        placeholder="Chat ID डालें"
        autocomplete="off"
    >

    <button
        type="button"
        id="joinBtn"
        onclick="joinChat()"
    >
        Join
    </button>

</div>


<!-- ROOM -->

<div id="roomName"></div>


<!-- TYPING -->

<div id="typingStatus"></div>


<!-- SELECT BAR -->

<div id="selectBar">

    <span id="selectedCount">
        0 selected
    </span>

    <button
        type="button"
        id="deleteSelectedBtn"
        onclick="deleteSelectedMessages()"
    >
        🗑️ Delete
    </button>

    <button
        type="button"
        id="cancelSelectBtn"
        onclick="cancelSelection()"
    >
        ✕
    </button>

</div>


<!-- MESSAGES -->

<div id="messages"></div>


<!-- EDIT BAR -->

<div id="editBar">

    <span>
        ✏️ Message edit कर रहे हैं
    </span>

    <button
        type="button"
        id="cancelEdit"
        onclick="cancelEdit()"
    >
        ✕
    </button>

</div>


<!-- SEND -->

<div class="send">

    <input
        id="message"
        type="text"
        placeholder="Message likho..."
        disabled
        autocomplete="off"
        oninput="typing()"
        onkeydown="handleEnter(event)"
    >

    <button
        type="button"
        id="sendBtn"
        onclick="sendMessage()"
        disabled
    >
        Send
    </button>

</div>


</div>


<!-- MESSAGE MENU -->

<div id="messageMenu">

    <button
        type="button"
        onclick="editSelectedMessage()"
    >
        ✏️ Edit
    </button>

    <button
        type="button"
        onclick="deleteSingleMessage()"
    >
        🗑️ Delete
    </button>

    <button
        type="button"
        onclick="startSelectionFromMenu()"
    >
        ☑️ Select
    </button>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDMXaQ6iS7wI67QYkXaxabn-uKJeiXPxHA",

    authDomain:
        "mychat-51ee7.firebaseapp.com",

    projectId:
        "mychat-51ee7",

    storageBucket:
        "mychat-51ee7.firebasestorage.app",

    messagingSenderId:
        "917061147739",

    appId:
        "1:917061147739:web:26644bb81926959325337e",

    measurementId:
        "G-SK11R1SYJ8"
};


firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


/* =========================
   USER ID
========================= */

let myUserId =
    localStorage.getItem("myChatUserId");


if (!myUserId) {

    myUserId =
        "user_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 9);

    localStorage.setItem(
        "myChatUserId",
        myUserId
    );
}


/* =========================
   VARIABLES
========================= */

let currentChatId = "";

let unsubscribeMessages = null;

let unsubscribeTyping = null;

let typingTimer = null;

let selectedMessageId = null;

let selectedMessageData = null;

let editingMessageId = null;


/* MULTI SELECT */

let selectionMode = false;

let selectedMessages = new Set();


/* =========================
   JOIN CHAT
========================= */

function joinChat() {

    const chatInput =
        document.getElementById("chatId");

    const chatId =
        chatInput.value.trim();


    if (chatId === "") {

        alert("Chat ID डालें");

        return;
    }


    currentChatId = chatId;


    if (unsubscribeMessages) {

        unsubscribeMessages();

        unsubscribeMessages = null;
    }


    if (unsubscribeTyping) {

        unsubscribeTyping();

        unsubscribeTyping = null;
    }


    document.getElementById(
        "roomName"
    ).style.display = "block";


    document.getElementById(
        "roomName"
    ).textContent =
        "🔒 Chat ID: " +
        currentChatId;


    document.getElementById(
        "message"
    ).disabled = false;


    document.getElementById(
        "sendBtn"
    ).disabled = false;


    loadMessages();

    watchTyping();


    setTimeout(() => {

        document.getElementById(
            "message"
        ).focus();

    }, 100);

}


/* =========================
   SEND MESSAGE
========================= */

function sendMessage() {

    const input =
        document.getElementById("message");

    const text =
        input.value.trim();


    if (text === "") {

        return;
    }


    if (currentChatId === "") {

        alert("Pehle Join karo");

        return;
    }


    /* EDIT MODE */

    if (editingMessageId) {

        db.collection("messages")
            .doc(editingMessageId)
            .update({

                text: text,

                edited: true,

                editedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            })
            .then(() => {

                input.value = "";

                cancelEdit();

                keepFocus();

            })
            .catch((error) => {

                alert(
                    "Edit nahi hua: " +
                    error.message
                );

            });

        return;
    }


    /* NEW MESSAGE */

    db.collection("messages")
        .add({

            chatId:
                currentChatId,

            text:
                text,

            sender:
                myUserId,

            edited:
                false,

            createdAt:
                firebase.firestore
                    .FieldValue
                    .serverTimestamp()

        })
        .then(() => {

            input.value = "";

            stopTyping();

            keepFocus();

        })
        .catch((error) => {

            alert(
                "Message send nahi hua: " +
                error.message
            );

        });

}


/* =========================
   KEEP INPUT ACTIVE
========================= */

function keepFocus() {

    const input =
        document.getElementById("message");


    if (input.disabled) {

        return;
    }


    input.focus();


    setTimeout(() => {

        input.focus();

    }, 50);

}


/* =========================
   LOAD MESSAGES
========================= */

function loadMessages() {

    const messages =
        document.getElementById("messages");


    unsubscribeMessages =
        db.collection("messages")

            .where(
                "chatId",
                "==",
                currentChatId
            )

            .onSnapshot(

                (snapshot) => {

                    messages.innerHTML = "";

                    let list = [];


                    snapshot.forEach((doc) => {

                        list.push({

                            id:
                                doc.id,

                            ...doc.data()

                        });

                    });


                    list.sort((a, b) => {

                        const aTime =
                            a.createdAt
                                ? a.createdAt.toMillis()
                                : 0;

                        const bTime =
                            b.createdAt
                                ? b.createdAt.toMillis()
                                : 0;

                        return aTime - bTime;

                    });


                    list.forEach((msg) => {

                        createMessageElement(
                            msg,
                            messages
                        );

                    });


                    messages.scrollTop =
                        messages.scrollHeight;

                },

                (error) => {

                    console.error(error);

                    messages.innerHTML =
                        "<div style='color:red;padding:15px'>" +
                        "Messages load nahi ho pa rahe." +
                        "</div>";

                }

            );

}


/* =========================
   CREATE MESSAGE
========================= */

function createMessageElement(
    msg,
    container
) {

    const row =
        document.createElement("div");


    row.className =
        "messageRow";


    if (msg.sender === myUserId) {

        row.classList.add("myRow");

    } else {

        row.classList.add("otherRow");

    }


    /* CHECKBOX */

    if (
        selectionMode &&
        msg.sender === myUserId
    ) {

        const checkbox =
            document.createElement("input");

        checkbox.type =
            "checkbox";

        checkbox.className =
            "selectBox";

        checkbox.checked =
            selectedMessages.has(
                msg.id
            );


        checkbox.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

            }
        );


        checkbox.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    selectedMessages.add(
                        msg.id
                    );

                } else {

                    selectedMessages.delete(
                        msg.id
                    );

                }


                updateSelectionBar();

            }
        );


        row.appendChild(
            checkbox
        );

    }


    /* MESSAGE */

    const div =
        document.createElement("div");


    div.className =
        "message";


    if (msg.sender === myUserId) {

        div.classList.add(
            "my-message"
        );

    } else {

        div.classList.add(
            "other-message"
        );

    }


    if (
        selectedMessages.has(
            msg.id
        )
    ) {

        div.classList.add(
            "selectedMessage"
        );

    }


    div.textContent =
        msg.text || "";


    /* EDITED */

    if (msg.edited) {

        const edited =
            document.createElement("span");

        edited.className =
            "edited";

        edited.textContent =
            "edited";

        div.appendChild(
            edited
        );

    }


    /* SELECT MODE */

    if (
        selectionMode &&
        msg.sender === myUserId
    ) {

        div.addEventListener(
            "click",
            function() {

                if (
                    selectedMessages.has(
                        msg.id
                    )
                ) {

                    selectedMessages.delete(
                        msg.id
                    );

                } else {

                    selectedMessages.add(
                        msg.id
                    );

                }


                updateSelectionBar();

                loadMessages();

            }
        );

    }


    /* NORMAL MODE */

    if (
        !selectionMode &&
        msg.sender === myUserId
    ) {

        addMessageActions(
            div,
            msg.id,
            msg
        );

    }


    row.appendChild(div);

    container.appendChild(row);

}


/* =========================
   MESSAGE ACTIONS
   LAPTOP RIGHT CLICK
   MOBILE LONG PRESS
========================= */

function addMessageActions(
    element,
    messageId,
    messageData
) {

    let timer = null;


    /* =====================
       LAPTOP RIGHT CLICK
    ===================== */

    element.addEventListener(
        "contextmenu",
        function(event) {

            event.preventDefault();

            selectedMessageId =
                messageId;

            selectedMessageData =
                messageData;

            showMessageMenu(event);

        }
    );


    /* =====================
       MOBILE LONG PRESS
    ===================== */

    element.addEventListener(
        "touchstart",
        function(event) {

            timer =
                setTimeout(() => {

                    selectedMessageId =
                        messageId;

                    selectedMessageData =
                        messageData;

                    showMessageMenu(
                        event
                    );

                }, 600);

        },
        {
            passive: true
        }
    );


    element.addEventListener(
        "touchend",
        function() {

            clearTimeout(timer);

        }
    );


    element.addEventListener(
        "touchmove",
        function() {

            clearTimeout(timer);

        }
    );

}


/* =========================
   SHOW MENU
========================= */

function showMessageMenu(event) {

    const menu =
        document.getElementById(
            "messageMenu"
        );


    menu.style.display =
        "block";


    let x = 20;

    let y = 100;


    if (
        event &&
        event.touches &&
        event.touches.length
    ) {

        x =
            event.touches[0]
                .clientX;

        y =
            event.touches[0]
                .clientY;

    } else if (event) {

        x =
            event.clientX;

        y =
            event.clientY;

    }


    if (
        x + 165 >
        window.innerWidth
    ) {

        x =
            window.innerWidth - 175;

    }


    if (
        y + 150 >
        window.innerHeight
    ) {

        y =
            window.innerHeight - 160;

    }


    menu.style.left =
        x + "px";

    menu.style.top =
        y + "px";

}


/* =========================
   EDIT MESSAGE
========================= */

function editSelectedMessage() {

    if (!selectedMessageId) {

        return;
    }


    const input =
        document.getElementById(
            "message"
        );


    input.value =
        selectedMessageData.text ||
        "";


    editingMessageId =
        selectedMessageId;


    document.getElementById(
        "editBar"
    ).style.display =
        "block";


    closeMessageMenu();

    keepFocus();

}


/* =========================
   DELETE ONE MESSAGE
========================= */

function deleteSingleMessage() {

    if (!selectedMessageId) {

        return;
    }


    const ok =
        confirm(
            "Ye message delete karna hai?"
        );


    if (!ok) {

        closeMessageMenu();

        return;
