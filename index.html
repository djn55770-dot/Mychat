<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Chat App</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #d9dbd5;
}

body {
    overflow: hidden;
}

.chat {
    width: 100%;
    max-width: 600px;
    height: 100dvh;
    margin: auto;
    background: #efe7dd;
    display: flex;
    flex-direction: column;
}

/* HEADER */
.header {
    flex-shrink: 0;
    background: #075e54;
    color: white;
    padding: 17px;
    font-size: 24px;
    font-weight: bold;
}

/* JOIN */
.join {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding: 9px;
    background: #075e54;
}

#chatId {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: none;
    border-radius: 9px;
    outline: none;
    font-size: 16px;
}

#joinBtn {
    padding: 0 18px;
    border: none;
    border-radius: 9px;
    background: white;
    color: #075e54;
    font-weight: bold;
    font-size: 16px;
}

/* ROOM */
#roomName {
    display: none;
    flex-shrink: 0;
    background: #128c7e;
    color: white;
    padding: 9px 13px;
}

/* TYPING */
#typingStatus {
    height: 24px;
    flex-shrink: 0;
    padding-left: 14px;
    padding-top: 4px;
    background: #efe7dd;
    color: #128c7e;
    font-size: 13px;
    font-style: italic;
}

/* MESSAGES */
#messages {
    flex: 1;
    min-height: 0;
    padding: 10px;
    overflow-y: auto;

    display: flex;
    flex-direction: column;
    justify-content: flex-end;
}

.message {
    position: relative;
    padding: 9px 13px;
    margin: 4px 0;
    border-radius: 11px;
    max-width: 80%;
    width: fit-content;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    font-size: 16px;
    line-height: 1.35;

    user-select: none;
    -webkit-user-select: none;
}

.my-message {
    align-self: flex-end;
    background: #dcf8c6;
    border-bottom-right-radius: 3px;
}

.other-message {
    align-self: flex-start;
    background: white;
    border-bottom-left-radius: 3px;
}

.edited {
    font-size: 11px;
    color: #777;
    margin-left: 5px;
}

/* SEND */
.send {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding: 9px;
    background: #ddd;
}

#message {
    flex: 1;
    min-width: 0;
    height: 48px;
    padding: 0 16px;
    border: none;
    border-radius: 25px;
    outline: none;
    background: white;
    color: #111;
    font-size: 16px;
}

#sendBtn {
    flex-shrink: 0;
    height: 48px;
    padding: 0 18px;
    border: none;
    border-radius: 25px;
    background: #128c7e;
    color: white;
    font-weight: bold;
}

/* EDIT MODE */
#editBar {
    display: none;
    background: #e8e8e8;
    padding: 8px 12px;
    border-left: 4px solid #128c7e;
}

#editBar span {
    color: #075e54;
    font-size: 14px;
}

#cancelEdit {
    float: right;
    border: none;
    background: transparent;
    color: #777;
    font-size: 18px;
}

/* LONG PRESS MENU */
#messageMenu {
    display: none;
    position: fixed;
    z-index: 9999;
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    overflow: hidden;
}

#messageMenu button {
    display: block;
    width: 150px;
    padding: 13px;
    border: none;
    background: white;
    text-align: left;
    font-size: 16px;
}

#messageMenu button:active {
    background: #eee;
}

/* MOBILE */
@media (max-width: 600px) {

    .message {
        max-width: 84%;
    }
}
</style>
</head>


<body>

<div class="chat">

    <div class="header">
        💬 My Chat
    </div>

    <div class="join">

        <input
            id="chatId"
            placeholder="Chat ID डालें"
            autocomplete="off"
        >

        <button id="joinBtn" onclick="joinChat()">
            Join
        </button>

    </div>

    <div id="roomName"></div>

    <div id="typingStatus"></div>

    <div id="messages"></div>

    <div id="editBar">
        <span>✏️ Message edit कर रहे हैं</span>
        <button id="cancelEdit" onclick="cancelEdit()">✕</button>
    </div>

    <div class="send">

        <input
            id="message"
            placeholder="Message likho..."
            disabled
            autocomplete="off"
            oninput="typing()"
            onkeydown="handleEnter(event)"
        >

        <button
            id="sendBtn"
            onclick="sendMessage()"
            disabled
        >
            Send
        </button>

    </div>

</div>


<!-- LONG PRESS MENU -->

<div id="messageMenu">

    <button onclick="editSelectedMessage()">
        ✏️ Edit
    </button>

    <button onclick="deleteSelectedMessage()">
        🗑️ Delete
    </button>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey: "AIzaSyDMXaQ6iS7wI67QYkXaxabn-uKJeiXPxHA",

    authDomain: "mychat-51ee7.firebaseapp.com",

    projectId: "mychat-51ee7",

    storageBucket: "mychat-51ee7.firebasestorage.app",

    messagingSenderId: "917061147739",

    appId: "1:917061147739:web:26644bb81926959325337e",

    measurementId: "G-SK11R1SYJ8"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


/* =========================
   UNIQUE USER ID
========================= */

let myUserId =
    localStorage.getItem("myChatUserId");

if (!myUserId) {

    myUserId =
        "user_" +
        Date.now() +
        "_" +
        Math.random()
        .toString(36)
        .substring(2, 9);

    localStorage.setItem(
        "myChatUserId",
        myUserId
    );
}


/* =========================
   VARIABLES
========================= */

let currentChatId = "";

let unsubscribeMessages = null;

let unsubscribeTyping = null;

let typingTimer = null;

let selectedMessageId = null;

let selectedMessageData = null;

let editingMessageId = null;


/* =========================
   JOIN CHAT
========================= */

function joinChat() {

    const chatId =
        document
        .getElementById("chatId")
        .value
        .trim();

    if (chatId === "") {

        alert("Chat ID डालें");

        return;
    }

    currentChatId = chatId;


    if (unsubscribeMessages) {

        unsubscribeMessages();

        unsubscribeMessages = null;
    }


    if (unsubscribeTyping) {

        unsubscribeTyping();

        unsubscribeTyping = null;
    }


    document
        .getElementById("roomName")
        .style.display = "block";


    document
        .getElementById("roomName")
        .textContent =
        "🔒 Chat ID: " + currentChatId;


    document
        .getElementById("message")
        .disabled = false;


    document
        .getElementById("sendBtn")
        .disabled = false;


    loadMessages();

    watchTyping();

}


/* =========================
   SEND / EDIT
========================= */

function sendMessage() {

    const input =
        document.getElementById("message");

    const text =
        input.value.trim();


    if (text === "") {

        return;
    }


    if (currentChatId === "") {

        alert("Pehle Join karo");

        return;
    }


    /* EDIT MODE */

    if (editingMessageId) {

        db.collection("messages")
            .doc(editingMessageId)
            .update({

                text: text,

                edited: true,

                editedAt:
                    firebase.firestore.FieldValue
                    .serverTimestamp()

            })
            .then(() => {

                input.value = "";

                cancelEdit();

            })
            .catch((error) => {

                alert(
                    "Edit nahi hua: " +
                    error.message
                );

            });

        return;
    }


    /* NEW MESSAGE */

    db.collection("messages")
        .add({

            chatId: currentChatId,

            text: text,

            sender: myUserId,

            edited: false,

            createdAt:
                firebase.firestore.FieldValue
                .serverTimestamp()

        })
        .then(() => {

            input.value = "";

            stopTyping();

        })
        .catch((error) => {

            alert(
                "Message send nahi hua: " +
                error.message
            );

        });

}


/* =========================
   LOAD MESSAGES
========================= */

function loadMessages() {

    const messages =
        document.getElementById("messages");


    unsubscribeMessages =
        db.collection("messages")

        .where(
            "chatId",
            "==",
            currentChatId
        )

        .onSnapshot(

            (snapshot) => {

                messages.innerHTML = "";

                let list = [];


                snapshot.forEach((doc) => {

                    list.push({

                        id: doc.id,

                        ...doc.data()

                    });

                });


                list.sort((a, b) => {

                    const aTime =
                        a.createdAt
                        ? a.createdAt.toMillis()
                        : 0;

                    const bTime =
                        b.createdAt
                        ? b.createdAt.toMillis()
                        : 0;

                    return aTime - bTime;

                });


                list.forEach((msg) => {

                    const div =
                        document.createElement("div");


                    div.classList.add(
                        "message"
                    );


                    /* APNA MESSAGE */

                    if (
                        msg.sender ===
                        myUserId
                    ) {

                        div.classList.add(
                            "my-message"
                        );

                    }

                    /* DUSRA MESSAGE */

                    else {

                        div.classList.add(
                            "other-message"
                        );

                    }


                    /* MESSAGE TEXT */

                    div.textContent =
                        msg.text || "";


                    /* EDITED */

                    if (msg.edited) {

                        const edited =
                            document.createElement(
                                "span"
                            );

                        edited.className =
                            "edited";

                        edited.textContent =
                            "edited";

                        div.appendChild(
                            edited
                        );

                    }


                    /* LONG PRESS ONLY FOR OWN MESSAGE */

                    if (
                        msg.sender ===
                        myUserId
                    ) {

                        addLongPress(
                            div,
                            msg.id,
                            msg
                        );

                    }


                    messages.appendChild(div);

                });


                messages.scrollTop =
                    messages.scrollHeight;

            },

            (error) => {

                console.error(error);

                messages.innerHTML =
                    "<div class='error'>" +
                    "Messages load nahi ho pa rahe." +
                    "</div>";

            }

        );

}


/* =========================
   LONG PRESS
========================= */

function addLongPress(
    element,
    messageId,
    messageData
) {

    let timer = null;

    let longPressed = false;


    function startPress(event) {

        longPressed = false;


        timer = setTimeout(() => {

            longPressed = true;


            selectedMessageId =
                messageId;

            selectedMessageData =
                messageData;


            showMessageMenu(
                event
            );

        }, 600);

    }


    function cancelPress() {

        clearTimeout(timer);

    }


    element.addEventListener(
        "touchstart",
        startPress,
        { passive: true }
    );


    element.addEventListener(
        "touchend",
        cancelPress
    );


    element.addEventListener(
        "touchmove",
        cancelPress
    );


    /* COMPUTER */

    element.addEventListener(
        "mousedown",
        startPress
    );


    element.addEventListener(
        "mouseup",
        cancelPress
    );


    element.addEventListener(
        "mouseleave",
        cancelPress
    );

}


/* =========================
   SHOW MENU
========================= */

function showMessageMenu(event) {

    const menu =
        document.getElementById(
            "messageMenu"
        );


    menu.style.display = "block";


    let x = 0;

    let y = 0;


    if (
        event &&
        event.touches &&
        event.touches.length
    ) {

        x =
            event.touches[0].clientX;

        y =
            event.touches[0].clientY;

    }

    else if (event) {

        x = event.clientX;

        y = event.clientY;

    }


    /* Screen ke andar menu */

    if (x + 150 > window.innerWidth) {

        x =
            window.innerWidth - 160;

    }


    if (y + 100 > window.innerHeight) {

        y =
            window.innerHeight - 110;

    }


    menu.style.left =
        x + "px";

    menu.style.top =
        y + "px";

}


/* =========================
   EDIT MESSAGE
========================= */

function editSelectedMessage() {

    if (!selectedMessageId) {

        return;
    }


    const input =
        document.getElementById(
            "message"
        );


    input.value =
        selectedMessageData.text || "";


    editingMessageId =
        selectedMessageId;


    document
        .getElementById("editBar")
        .style.display = "block";


    input.focus();


    closeMessageMenu();

}


/* =========================
   DELETE MESSAGE
========================= */

function deleteSelectedMessage() {

    if (!selectedMessageId) {

        return;
    }


    const confirmDelete =
        confirm(
            "Kya aap ye message delete karna chahte hain?"
        );


    if (!confirmDelete) {

        closeMessageMenu();

        return;
    }


    db.collection("messages")
        .doc(selectedMessageId)
        .delete()
        .then(() => {

            closeMessageMenu();

        })
        .catch((error) => {

            alert(
                "Message delete nahi hua: " +
                error.message
            );

        });

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit() {

    editingMessageId = null;

    document
        .getElementById("message")
        .value = "";


    document
        .getElementById("editBar")
        .style.display = "none";

}


/* =========================
   CLOSE MENU
========================= */

function closeMessageMenu() {

    document
        .getElementById(
            "messageMenu"
        )
        .style.display = "none";


    selectedMessageId = null;

    selectedMessageData = null;

}


/* =========================
   OUTSIDE CLICK
========================= */

document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "messageMenu"
            );


        if (
            menu.style.display === "block" &&
            !menu.contains(event.target)
        ) {

            closeMessageMenu();

        }

    }
);


/* =========================
   TYPING
========================= */

function typing() {

    if (currentChatId === "") {

        return;
    }


    db.collection("typing")
        .doc(currentChatId)
        .set({

            userId: myUserId,

            typing: true,

            time:
                firebase.firestore.FieldValue
                .serverTimestamp()

        });


    clearTimeout(typingTimer);


    typingTimer =
        setTimeout(
            stopTyping,
            1500
        );

}


/* =========================
   STOP TYPING
========================= */

function stopTyping() {

    if (currentChatId === "") {

        return;
    }


    db.collection("typing")
        .doc(currentChatId)
        .set({

            userId: myUserId,

            typing: false,

            time:
                firebase.firestore.FieldValue
                .serverTimestamp()

        });

}


/* =========================
   WATCH TYPING
========================= */

function watchTyping() {

    const status =
        document.getElementById(
            "typingStatus"
        );


    unsubscribeTyping =
        db.collection("typing")
        .doc(currentChatId)
        .onSnapshot(
            (doc) => {

                const data =
                    doc.data();


                if (
                    data &&
                    data.typing === true &&
                    data.userId !== myUserId
                ) {

                    status.textContent =
                        "typing...";

                }

                else {

                    status.textContent =
                        "";

                }

            }
        );

}


/* =========================
   ENTER
========================= */

function handleEnter(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

    }

}


/* =========================
   CHAT ID ENTER
========================= */

document
    .getElementById("chatId")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                joinChat();

            }

        }
    );

</script>

</body>
  </html>
