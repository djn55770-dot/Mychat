<!DOCTYPE html>
<html>
<head>
    <title>My Chat App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #d9dbd5;
        }

        .chat {
            width: 100%;
            max-width: 560px;
            height: 100vh;
            margin: auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #075e54;
            color: white;
            padding: 16px;
            font-size: 22px;
            font-weight: bold;
        }

        .join {
            display: flex;
            padding: 10px;
            background: #075e54;
        }

        #chatId {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        #joinBtn {
            margin-left: 8px;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #075e54;
            font-weight: bold;
        }

        #roomName {
            padding: 8px 15px;
            background: #128c7e;
            color: white;
            font-size: 14px;
            display: none;
        }

        #messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #efe7dd;
        }

        .message {
            background: #dcf8c6;
            padding: 10px 14px;
            margin: 8px 0 8px auto;
            border-radius: 10px;
            width: fit-content;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 16px;
        }

        .send {
            display: flex;
            padding: 10px;
            background: #ddd;
        }

        #message {
            flex: 1;
            padding: 13px;
            border-radius: 25px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        #sendBtn {
            margin-left: 8px;
            padding: 12px 18px;
            border: none;
            border-radius: 25px;
            background: #128c7e;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="chat">

    <div class="header">
        💬 My Chat
    </div>

    <div class="join">
        <input id="chatId" placeholder="Chat ID डालें">
        <button id="joinBtn" onclick="joinChat()">Join</button>
    </div>

    <div id="roomName"></div>

    <div id="messages"></div>

    <div class="send">
        <input id="message" placeholder="Message likho..." disabled>
        <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
    </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyDMXaQ6iS7wI67QYkXaxabn-uKJeiXPxHA",
    authDomain: "mychat-51ee7.firebaseapp.com",
    projectId: "mychat-51ee7",
    storageBucket: "mychat-51ee7.firebasestorage.app",
    messagingSenderId: "917061147739",
    appId: "1:917061147739:web:26644bb81926959325337e",
    measurementId: "G-SK11R1SYJ8"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let currentChatId = "";
let unsubscribe = null;


// Chat join karna
function joinChat() {

    const input = document.getElementById("chatId");
    const chatId = input.value.trim();

    if (chatId === "") {
        alert("Chat ID डालें");
        return;
    }

    currentChatId = chatId;

    // Purana listener band
    if (unsubscribe) {
        unsubscribe();
    }

    document.getElementById("roomName").style.display = "block";
    document.getElementById("roomName").textContent =
        "🔐 Chat ID: " + currentChatId;

    document.getElementById("message").disabled = false;
    document.getElementById("sendBtn").disabled = false;

    input.value = "";

    listenMessages();
}


// Real-time messages
function joinChat() {
    const input = document.getElementById("chatId");
    const chatId = input.value.trim();

    if (chatId === "") {
        alert("Chat ID डालें");
        return;
    }

    currentChatId = chatId;

    // Purana listener band karo
    if (unsubscribe) {
        unsubscribe();
        unsubscribe = null;
    }

    // Room name dikhao
    document.getElementById("roomName").style.display = "block";
    document.getElementById("roomName").textContent =
        "🔒 Chat ID: " + currentChatId;

    // Message input enable
    document.getElementById("message").disabled = false;
    document.getElementById("sendBtn").disabled = false;

    // Messages load karo
    unsubscribe = db.collection("messages")
        .where("chatId", "==", currentChatId)
        .orderBy("createdAt", "asc")
        .onSnapshot(
            (snapshot) => {
                const messages = document.getElementById("messages");
                messages.innerHTML = "";

                snapshot.forEach((doc) => {
                    const data = doc.data();

                    const div = document.createElement("div");
                    div.className = "message";
                    div.textContent = data.text;

                    messages.appendChild(div);
                });

                messages.scrollTop = messages.scrollHeight;
            },
            (error) => {
                console.error(error);
                document.getElementById("messages").innerHTML =
                    "<p style='color:red'>Messages load nahi ho pa rahe.</p>";
            }
        );
}


// Message send karna
function sendMessage() {

    const input = document.getElementById("message");

    const text = input.value.trim();

    if (text === "") return;

    if (currentChatId === "") {
        alert("Pehle Chat ID join karo");
        return;
    }

    db.collection("messages").add({

        chatId: currentChatId,

        text: text,

        createdAt: firebase.firestore.FieldValue.serverTimestamp()

    });

    input.value = "";
}


// Enter dabane par message send
document.getElementById("message").addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});


// Chat ID save karna
window.addEventListener("load", function() {

    const savedChat = localStorage.getItem("chatId");

    if (savedChat) {

        document.getElementById("chatId").value = savedChat;

        joinChat();
    }

});

</script>

</body>
</html>
