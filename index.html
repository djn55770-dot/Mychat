<!DOCTYPE html>
<html>
<head>
    <title>My Chat App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial;
            background: #d9dbd5;
        }

        .chat {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            margin: auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #075e54;
            color: white;
            padding: 15px;
            font-size: 21px;
            font-weight: bold;
        }

        .room {
            padding: 10px;
            background: #128c7e;
            display: flex;
            gap: 5px;
        }

        .room input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            outline: none;
        }

        .room button {
            background: white;
            color: #075e54;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }

        #messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #efe7dd;
        }

        .message {
            background: #dcf8c6;
            padding: 10px 14px;
            margin: 8px 0 8px auto;
            border-radius: 10px;
            width: fit-content;
            max-width: 80%;
            word-wrap: break-word;
        }

        .send {
            display: flex;
            padding: 10px;
            background: #ddd;
        }

        #message {
            flex: 1;
            padding: 13px;
            border-radius: 25px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        .send button {
            margin-left: 8px;
            padding: 12px 18px;
            border: none;
            border-radius: 25px;
            background: #128c7e;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="chat">

    <div class="header">
        💬 My Chat
    </div>

    <!-- Chat ID -->
    <div class="room">
        <input id="chatId" placeholder="Chat ID डालें">
        <button onclick="joinChat()">Join</button>
    </div>

    <div id="messages"></div>

    <div class="send">
        <input id="message" placeholder="Message likho...">
        <button onclick="sendMessage()">Send</button>
    </div>

</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDMXaQ6iS7wI67QYkXaxabn-uKJeiXPxHA",
  authDomain: "mychat-51ee7.firebaseapp.com",
  projectId: "mychat-51ee7",
  storageBucket: "mychat-51ee7.firebasestorage.app",
  messagingSenderId: "917061147739",
  appId: "1:917061147739:web:26644bb81926959325337e",
  measurementId: "G-SK11R1SYJ8"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let currentChat = "";


/* Chat join karna */
function joinChat() {

    const chatInput = document.getElementById("chatId");

    const id = chatInput.value.trim();

    if (id === "") {
        alert("Chat ID डालें");
        return;
    }

    currentChat = id;

    document.getElementById("messages").innerHTML = "";

    listenMessages();

    alert("Chat join ho gaya: " + id);
}


/* Message bhejna */
function sendMessage() {

    if (currentChat === "") {
        alert("Pehle Chat ID डालकर Join karein");
        return;
    }

    const input = document.getElementById("message");

    const text = input.value.trim();

    if (text === "") return;

    db.collection("messages").add({

        chatId: currentChat,

        text: text,

        createdAt:
            firebase.firestore.FieldValue.serverTimestamp()

    });

    input.value = "";
}


/* Real-time messages */
function listenMessages() {

    db.collection("messages")
      .where("chatId", "==", currentChat)
      .orderBy("createdAt", "asc")
      .onSnapshot((snapshot) => {

        const messages =
            document.getElementById("messages");

        messages.innerHTML = "";

        snapshot.forEach((doc) => {

            const data = doc.data();

            const div =
                document.createElement("div");

            div.className = "message";

            div.textContent = data.text;

            messages.appendChild(div);

        });

        messages.scrollTop =
            messages.scrollHeight;

    });
}

</script>

</body>
</html>
