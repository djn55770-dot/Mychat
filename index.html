<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Chat App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #d9dbd5;
        }

        body {
            overflow: hidden;
        }

        .chat {
            width: 100%;
            max-width: 600px;
            height: 100vh;
            margin: auto;
            background: #efe7dd;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* HEADER */
        .header {
            flex-shrink: 0;
            background: #075e54;
            color: white;
            padding: 18px 20px;
            font-size: 25px;
            font-weight: bold;
        }

        /* JOIN AREA */
        .join {
            flex-shrink: 0;
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #075e54;
        }

        #chatId {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 17px;
        }

        #joinBtn {
            padding: 0 20px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #075e54;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #joinBtn:active {
            transform: scale(0.97);
        }

        /* ROOM NAME */
        #roomName {
            flex-shrink: 0;
            background: #128c7e;
            color: white;
            padding: 10px 15px;
            font-size: 17px;
            display: none;
        }

        /* TYPING */
        #typingStatus {
            flex-shrink: 0;
            height: 25px;
            padding-left: 15px;
            padding-top: 5px;
            color: #128c7e;
            font-size: 14px;
            font-style: italic;
            background: #efe7dd;
        }

        /* MESSAGES */
        #messages {
            flex: 1;
            min-height: 0;
            padding: 10px 10px 12px;
            overflow-y: auto;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;

            background: #efe7dd;
        }

        .message {
            padding: 10px 14px;
            margin: 4px 0;
            border-radius: 12px;
            max-width: 78%;
            width: fit-content;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            font-size: 16px;
            line-height: 1.35;
        }

        /* MY MESSAGE */
        .my-message {
            align-self: flex-end;
            background: #dcf8c6;
            border-bottom-right-radius: 3px;
        }

        /* OTHER MESSAGE */
        .other-message {
            align-self: flex-start;
            background: white;
            border-bottom-left-radius: 3px;
        }

        /* SEND AREA */
        .send {
            flex-shrink: 0;
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #ddd;
        }

        #message {
            flex: 1;
            min-width: 0;
            padding: 14px 18px;
            border: none;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
            background: white;
        }

        #message:disabled {
            background: #eeeeee;
        }

        #sendBtn {
            flex-shrink: 0;
            padding: 0 20px;
            border: none;
            border-radius: 25px;
            background: #128c7e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #sendBtn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #sendBtn:active {
            transform: scale(0.97);
        }

        /* ERROR */
        .error {
            color: red;
            padding: 15px;
            text-align: center;
        }

        /* MOBILE */
        @media (max-width: 500px) {

            .header {
                font-size: 23px;
                padding: 16px;
            }

            #chatId {
                font-size: 16px;
            }

            #joinBtn {
                padding: 0 16px;
            }

            .message {
                max-width: 82%;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="chat">

        <!-- HEADER -->
        <div class="header">
            💬 My Chat
        </div>

        <!-- CHAT ID -->
        <div class="join">

            <input
                id="chatId"
                type="text"
                placeholder="Chat ID डालें"
                autocomplete="off"
            >

            <button id="joinBtn" onclick="joinChat()">
                Join
            </button>

        </div>

        <!-- ROOM NAME -->
        <div id="roomName"></div>

        <!-- TYPING STATUS -->
        <div id="typingStatus"></div>

        <!-- MESSAGES -->
        <div id="messages"></div>

        <!-- SEND -->
        <div class="send">

            <input
                id="message"
                type="text"
                placeholder="Message likho..."
                disabled
                autocomplete="off"
                oninput="typing()"
                onkeydown="handleEnter(event)"
            >

            <button
                id="sendBtn"
                onclick="sendMessage()"
                disabled
            >
                Send
            </button>

        </div>

    </div>


    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


    <script>

        /* =========================
           FIREBASE CONFIG
        ========================= */

        const firebaseConfig = {

            apiKey: "AIzaSyDMXaQ6iS7wI67QYkXaxabn-uKJeiXPxHA",

            authDomain: "mychat-51ee7.firebaseapp.com",

            projectId: "mychat-51ee7",

            storageBucket: "mychat-51ee7.firebasestorage.app",

            messagingSenderId: "917061147739",

            appId: "1:917061147739:web:26644bb81926959325337e",

            measurementId: "G-SK11R1SYJ8"

        };


        firebase.initializeApp(firebaseConfig);

        const db = firebase.firestore();


        /* =========================
           UNIQUE USER ID
        ========================= */

        let myUserId = localStorage.getItem("myUserId");

        if (!myUserId) {

            myUserId =
                "user_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2, 8);

            localStorage.setItem("myUserId", myUserId);
        }


        /* =========================
           VARIABLES
        ========================= */

        let currentChatId = "";

        let unsubscribeMessages = null;

        let unsubscribeTyping = null;

        let typingTimer = null;


        /* =========================
           JOIN CHAT
        ========================= */

        function joinChat() {

            const input =
                document.getElementById("chatId");

            const chatId =
                input.value.trim();

            if (chatId === "") {

                alert("Chat ID डालें");

                return;
            }


            currentChatId = chatId;


            /* पुराने listener बंद */

            if (unsubscribeMessages) {

                unsubscribeMessages();

                unsubscribeMessages = null;
            }


            if (unsubscribeTyping) {

                unsubscribeTyping();

                unsubscribeTyping = null;
            }


            /* Room show */

            const roomName =
                document.getElementById("roomName");

            roomName.style.display = "block";

            roomName.textContent =
                "🔒 Chat ID: " + currentChatId;


            /* Message input ON */

            document.getElementById("message").disabled = false;

            document.getElementById("sendBtn").disabled = false;


            /* Messages load */

            loadMessages();


            /* Typing watch */

            watchTyping();

        }


        /* =========================
           SEND MESSAGE
        ========================= */

        function sendMessage() {

            if (currentChatId === "") {

                alert("Pehle Chat ID Join karein");

                return;
            }


            const input =
                document.getElementById("message");

            const text =
                input.value.trim();


            if (text === "") {

                return;
            }


            db.collection("messages")
                .add({

                    chatId: currentChatId,

                    text: text,

                    sender: myUserId,

                    createdAt:
                        firebase.firestore.FieldValue
                            .serverTimestamp()

                })

                .then(() => {

                    input.value = "";

                    stopTyping();

                })

                .catch((error) => {

                    console.error(error);

                    alert(
                        "Message send nahi hua"
                    );

                });

        }


        /* =========================
           LOAD MESSAGES
        ========================= */

        function loadMessages() {

            const messages =
                document.getElementById("messages");


            unsubscribeMessages =
                db.collection("messages")

                    .where(
                        "chatId",
                        "==",
                        currentChatId
                    )

                    .onSnapshot(

                        (snapshot) => {

                            messages.innerHTML = "";


                            const data = [];


                            snapshot.forEach((doc) => {

                                data.push({

                                    id: doc.id,

                                    ...doc.data()

                                });

                            });


                            /* Time ke according sort */

                            data.sort((a, b) => {

                                const aTime =
                                    a.createdAt
                                        ? a.createdAt.toMillis()
                                        : 0;

                                const bTime =
                                    b.createdAt
                                        ? b.createdAt.toMillis()
                                        : 0;

                                return aTime - bTime;

                            });


                            /* Messages show */

                            data.forEach((msg) => {

                                const div =
                                    document.createElement("div");


                                div.classList.add("message");


                                if (
                                    msg.sender === myUserId
                                ) {

                                    div.classList.add(
                                        "my-message"
                                    );

                                } else {

                                    div.classList.add(
                                        "other-message"
                                    );

                                }


                                div.textContent =
                                    msg.text;


                                messages.appendChild(div);

                            });


                            /* Latest message ke paas */

                            messages.scrollTop =
                                messages.scrollHeight;

                        },

                        (error) => {

                            console.error(error);

                            messages.innerHTML =
                                "<div class='error'>" +
                                "Messages load nahi ho pa rahe." +
                                "</div>";

                        }

                    );

        }


        /* =========================
           TYPING
        ========================= */

        function typing() {

            if (currentChatId === "") {

                return;
            }


            db.collection("typing")
                .doc(currentChatId)
                .set({

                    userId: myUserId,

                    typing: true,

                    time:
                        firebase.firestore.FieldValue
                            .serverTimestamp()

                });


            clearTimeout(typingTimer);


            typingTimer = setTimeout(() => {

                stopTyping();

            }, 1500);

        }


        /* =========================
           STOP TYPING
        ========================= */

        function stopTyping() {

            if (currentChatId === "") {

                return;
            }


            db.collection("typing")
                .doc(currentChatId)
                .set({

                    userId: myUserId,

                    typing: false,

                    time:
                        firebase.firestore.FieldValue
                            .serverTimestamp()

                });

        }


        /* =========================
           WATCH OTHER USER TYPING
        ========================= */

        function watchTyping() {

            const status =
                document.getElementById("typingStatus");


            unsubscribeTyping =
                db.collection("typing")
                    .doc(currentChatId)
                    .onSnapshot((doc) => {

                        const data =
                            doc.data();


                        if (
                            data &&
                            data.typing === true &&
                            data.userId !== myUserId
                        ) {

                            status.textContent =
                                "typing...";

                        } else {

                            status.textContent =
                                "";

                        }

                    });

        }


        /* =========================
           ENTER BUTTON
        ========================= */

        function handleEnter(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }


        /* =========================
           ENTER ON CHAT ID
        ========================= */

        document
            .getElementById("chatId")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        joinChat();

                    }

                }
            );

    </script>

</body>

</html>
