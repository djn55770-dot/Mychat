<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Chat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #d9dbd5;
}

.chat {
    width: 100%;
    max-width: 550px;
    height: 100vh;
    margin: auto;
    background: #efe7dd;
    display: flex;
    flex-direction: column;
}

.header {
    background: #075e54;
    color: white;
    padding: 17px;
    font-size: 23px;
    font-weight: bold;
}

.join {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #075e54;
}

.join input {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

.join button {
    padding: 0 18px;
    border: none;
    border-radius: 8px;
    background: white;
    color: #075e54;
    font-weight: bold;
}

.room {
    display: none;
    padding: 9px 12px;
    background: #128c7e;
    color: white;
}

#messages {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
}

.message {
    padding: 9px 13px;
    margin: 7px 0;
    border-radius: 10px;
    max-width: 78%;
    width: fit-content;
    word-wrap: break-word;
    font-size: 16px;
}

/* APNA MESSAGE - RIGHT */
.my-message {
    margin-left: auto;
    background: #dcf8c6;
}

/* DUSRE KA MESSAGE - LEFT */
.other-message {
    margin-right: auto;
    background: white;
}

.send {
    display: none;
    padding: 9px;
    gap: 8px;
    background: #ddd;
}

.send input {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 25px;
    outline: none;
    font-size: 16px;
}

.send button {
    padding: 0 18px;
    border: none;
    border-radius: 25px;
    background: #128c7e;
    color: white;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="chat">

    <div class="header">
        💬 My Chat
    </div>

    <div class="join">
        <input id="chatId" placeholder="Chat ID डालें">
        <button onclick="joinChat()">Join</button>
    </div>

    <div class="room" id="roomName"></div>

    <div id="messages"></div>

    <div class="send" id="sendBox">
        <input id="message" placeholder="Message likho...">
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyDMXaQ6iS7wI67QYkXaxabn-uKJeiXPxHA",
    authDomain: "mychat-51ee7.firebaseapp.com",
    projectId: "mychat-51ee7",
    storageBucket: "mychat-51ee7.firebasestorage.app",
    messagingSenderId: "917061147739",
    appId: "1:917061147739:web:26644bb81926959325337e",
    measurementId: "G-SK11R1SYJ8"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let currentChatId = "";
let myUserId = "";
let unsubscribe = null;


/* HAR MOBILE KO ALAG ID */
function getUserId() {

    let id = localStorage.getItem("myChatUserId");

    if (!id) {

        id = "user_" +
             Date.now() +
             "_" +
             Math.random()
                .toString(36)
                .substring(2, 8);

        localStorage.setItem("myChatUserId", id);
    }

    return id;
}

myUserId = getUserId();


/* JOIN CHAT */
function joinChat() {

    const input = document.getElementById("chatId");

    const chatId = input.value.trim();

    if (chatId === "") {

        alert("Chat ID डालें");

        return;
    }

    currentChatId = chatId;

    if (unsubscribe) {
        unsubscribe();
    }

    document.getElementById("roomName").style.display = "block";

    document.getElementById("roomName").textContent =
        "🔒 Chat ID: " + currentChatId;

    document.getElementById("sendBox").style.display = "flex";

    document.getElementById("messages").innerHTML = "";

    loadMessages();
}


/* LOAD REAL-TIME MESSAGES */
function loadMessages() {

    const messages =
        document.getElementById("messages");

    unsubscribe = db
        .collection("chats")
        .doc(currentChatId)
        .collection("messages")
        .onSnapshot(

            function(snapshot) {

                messages.innerHTML = "";

                let list = [];

                snapshot.forEach(function(doc) {

                    const data = doc.data();

                    list.push(data);
                });


                list.sort(function(a, b) {

                    return (a.time || 0) -
                           (b.time || 0);
                });


                list.forEach(function(data) {

                    const div =
                        document.createElement("div");

                    div.classList.add("message");


                    /* APNA YA DUSRE KA */
                    if (data.senderId === myUserId) {

                        div.classList.add(
                            "my-message"
                        );

                    } else {

                        div.classList.add(
                            "other-message"
                        );
                    }


                    div.textContent = data.text;

                    messages.appendChild(div);
                });


                messages.scrollTop =
                    messages.scrollHeight;
            },

            function(error) {

                console.error(error);

                messages.innerHTML =
                    "<p style='color:red'>" +
                    error.message +
                    "</p>";
            }
        );
}


/* SEND MESSAGE */
function sendMessage() {

    const input =
        document.getElementById("message");

    const text =
        input.value.trim();

    if (text === "") {
        return;
    }

    if (currentChatId === "") {

        alert("Pehle Chat ID Join karo");

        return;
    }


    db.collection("chats")
        .doc(currentChatId)
        .collection("messages")
        .add({

            text: text,

            senderId: myUserId,

            time: Date.now()

        })
        .then(function() {

            input.value = "";

            input.focus();

        })
        .catch(function(error) {

            alert(
                "Message send nahi hua: " +
                error.message
            );
        });
}


/* ENTER SE SEND */
document
    .getElementById("message")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();
            }
        }
    );

</script>

</body>
</html>
