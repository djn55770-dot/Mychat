<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Chat</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7f9;
  color:#111;
}

header{
  background:#075e54;
  color:white;
  padding:15px;
  position:sticky;
  top:0;
  z-index:10;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.title{
  font-size:22px;
  font-weight:bold;
}

.menu button{
  border:0;
  background:transparent;
  color:white;
  font-size:25px;
  cursor:pointer;
}

.toolbar{
  display:none;
  background:white;
  padding:10px;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:56px;
  z-index:9;
}

.toolbar button{
  border:0;
  padding:10px 13px;
  margin-right:6px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}

.select-btn{
  background:#e8f5e9;
  color:#075e54;
}

.delete-btn{
  background:#ffebee;
  color:#c62828;
}

.clear-btn{
  background:#c62828;
  color:white;
}

.chat-list{
  padding:10px;
  padding-bottom:90px;
}

.chat{
  background:white;
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 1px 4px #ccc;
}

.chat.selected{
  background:#e0f2f1;
}

.checkbox{
  width:22px;
  height:22px;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#075e54;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:18px;
}

.chat-info{
  flex:1;
}

.chat-name{
  font-weight:bold;
  font-size:17px;
}

.chat-message{
  color:#777;
  margin-top:4px;
  font-size:14px;
}

.chat-time{
  color:#888;
  font-size:12px;
}

.add-box{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:10px;
  display:flex;
  gap:8px;
  box-shadow:0 -2px 8px #ccc;
}

.add-box input{
  flex:1;
  padding:13px;
  border:1px solid #ccc;
  border-radius:25px;
  font-size:16px;
}

.add-box button{
  width:50px;
  border:0;
  border-radius:50%;
  background:#075e54;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#777;
  padding:50px 20px;
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <div class="title">My Chat</div>

    <div class="menu">
      <button onclick="toggleSelectMode()">☑</button>
    </div>
  </div>
</header>

<div class="toolbar" id="toolbar">

  <button class="select-btn" onclick="selectAll()">
    Select All
  </button>

  <button class="select-btn" onclick="unselectAll()">
    Unselect All
  </button>

  <button class="delete-btn" onclick="deleteSelected()">
    Delete Selected
  </button>

  <button class="clear-btn" onclick="clearAll()">
    Clear All
  </button>

</div>

<div class="chat-list" id="chatList"></div>

<div class="add-box">
  <input
    type="text"
    id="chatInput"
    placeholder="Message likhiye..."
  >
  <button onclick="addChat()">➤</button>
</div>

<script>

let chats = JSON.parse(localStorage.getItem("myChats")) || [
  {
    id: Date.now(),
    name: "My Chat",
    message: "Welcome to My Chat",
    time: "Now"
  }
];

let selectMode = false;
let selected = new Set();

function saveChats(){
  localStorage.setItem("myChats", JSON.stringify(chats));
}

function showChats(){

  const list = document.getElementById("chatList");

  if(chats.length === 0){
    list.innerHTML =
      '<div class="empty">Koi chat nahi hai</div>';
    return;
  }

  list.innerHTML = "";

  chats.forEach(chat => {

    const div = document.createElement("div");

    div.className =
      "chat " +
      (selected.has(chat.id) ? "selected" : "");

    div.onclick = function(){

      if(selectMode){
        toggleChat(chat.id);
      }
    };

    div.innerHTML = `

      ${
        selectMode
        ? `<input
             type="checkbox"
             class="checkbox"
             ${selected.has(chat.id) ? "checked" : ""}
             onclick="event.stopPropagation(); toggleChat(${chat.id})"
           >`
        : ""
      }

      <div class="avatar">MC</div>

      <div class="chat-info">
        <div class="chat-name">
          ${escapeHTML(chat.name)}
        </div>

        <div class="chat-message">
          ${escapeHTML(chat.message)}
        </div>
      </div>

      <div class="chat-time">
        ${chat.time}
      </div>
    `;

    list.appendChild(div);
  });
}

function escapeHTML(text){
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function toggleSelectMode(){

  selectMode = !selectMode;

  selected.clear();

  document.getElementById("toolbar").style.display =
    selectMode ? "block" : "none";

  showChats();
}

function toggleChat(id){

  if(selected.has(id)){
    selected.delete(id);
  }else{
    selected.add(id);
  }

  showChats();
}

function selectAll(){

  chats.forEach(chat => {
    selected.add(chat.id);
  });

  showChats();
}

function unselectAll(){

  selected.clear();

  showChats();
}

function deleteSelected(){

  if(selected.size === 0){
    alert("Pehle chat select kijiye.");
    return;
  }

  if(!confirm(
    selected.size +
    " chat delete karna hai?"
  )){
    return;
  }

  chats = chats.filter(
    chat => !selected.has(chat.id)
  );

  selected.clear();

  saveChats();
  showChats();
}

function clearAll(){

  if(chats.length === 0){
    return;
  }

  if(!confirm(
    "Kya aap SABHI chats delete karna chahte hain?"
  )){
    return;
  }

  chats = [];
  selected.clear();

  saveChats();
  showChats();
}

function addChat(){

  const input =
    document.getElementById("chatInput");

  const message =
    input.value.trim();

  if(message === ""){
    alert("Message likhiye.");
    return;
  }

  chats.unshift({
    id: Date.now(),
    name: "My Chat",
    message: message,
    time: new Date().toLocaleTimeString(
      "hi-IN",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    )
  });

  input.value = "";

  saveChats();
  showChats();
}

document
  .getElementById("chatInput")
  .addEventListener("keydown", function(e){

    if(e.key === "Enter"){
      addChat();
    }

  });

showChats();

</script>

</body>
</html>
